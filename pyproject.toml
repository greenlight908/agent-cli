[project]
name = "agent-cli"
version = "0.1.0"
description = "One uniform CLI contract for tools whose main caller is an LLM agent (bare invocation prints full help to stdout, exit 0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mike" }]
keywords = ["cli", "argparse", "agent", "llm", "tooling"]
# Zero runtime dependencies, on purpose: a single-file PEP-723 script must be
# able to depend on this without pulling a tree in behind it.
dependencies = []

[project.urls]
Homepage = "https://github.com/greenlight908/agent-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The first eleven are the estate Ruff Baseline FLOOR. Its one machine-readable
# copy is BASELINE_SELECT in the `21-ruff-baseline` WND check — this list must stay
# a superset of it. `ANN` and `A` are this repo's own additions: the floor is a
# floor, not a ceiling, and adding rules never trips the gate.
#
# `BLE` is on because the code already carried a justified `# noqa: BLE001` at the
# one place a blind `except Exception` is correct — the catch-all boundary in
# wrap_main. The rule was never selected, so that directive was dead: enabling it
# makes the annotation mean what its author intended, rather than deleting it.
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "E",
    "F",
    "I",
    "PERF101",
    "PERF401",
    "RUF",
    "S",
    "SIM",
    "UP",
]
ignore = [
    "E501",   # line length — not a concern here
    "S101",   # assert — legitimate for solo-deploy invariants, and this repo is mostly tests
    "S108",   # /tmp/ usage — fine for solo deploy
    "S603",   # subprocess without shell=True — we control the inputs
    "S607",   # partial executable path — we control the environment
]

[tool.pyright]
# Every Python file, not just src/: `tests/` is half this repo's Python, and a gate
# that skips it is a gate with a hole in it. No `ignore` burn-down list — the repo
# is small enough to land clean, and an empty quarantine is the only kind that
# cannot silently grow.
include = ["src", "tests"]
pythonVersion = "3.11"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]
