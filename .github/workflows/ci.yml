name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to immutable digests, not tags: a tag is mutable, so the
      # maintainer — or whoever takes their account — can repoint it and the new
      # code runs on the next build with no PR, no diff, no notification
      # (tj-actions/changed-files, 2025-03).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      # Secret scan. The `gitleaks` pre-commit hook is `protect --staged`, so on CI's clean
      # checkout it scans zero bytes; this is the unscoped sweep of committed files
      # (38-secret-scan-baseline). Version must match the hook rev in .pre-commit-config.yaml.
      - name: Scan for plaintext credentials
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_BIN="$(mktemp -d)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$GITLEAKS_BIN" gitleaks
          "$GITLEAKS_BIN/gitleaks" dir . --redact --no-banner

      # `--locked` ASSERTS the lockfile is current and fails loud if it drifted.
      # The neighbouring flags are traps: `--frozen` installs a drifted lock
      # SILENTLY, and a bare `uv sync` rewrites it, hiding staleness behind a green.
      - run: uv sync --dev --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Over ALL the Python, src/ and tests/ alike — a gate that skips half the
      # repo is a gate with a hole in it. Config alone is not a gate; only an
      # actual invocation counts, which is why this step exists as well as the
      # pre-commit hook.
      - run: uv run pyright
      - run: uv run pytest -q

  # The package's whole reason to exist is that a one-file PEP-723 script can
  # depend on it. Asserted against the REAL published URL from a clean runner,
  # because `uv sync --dev --locked` above resolves the local checkout and would stay
  # green even if the published artefact were unusable.
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: A bare invocation prints help to stdout and exits 0
        run: |
          set -euo pipefail
          cat > /tmp/demo_cli.py <<'PY'
          # /// script
          # requires-python = ">=3.11"
          # dependencies = ["agent-cli @ git+https://github.com/greenlight908/agent-cli.git@${{ github.sha }}"]
          # ///
          from agent_cli import build_parser, parse_args_or_help, wrap_main


          def main() -> int:
              parser, sub = build_parser(__file__, description="CI consumer check")
              sub.add_parser("ping")
              args = parse_args_or_help(parser)
              if args.command == "ping":
                  print('{"ok": true}')
              return 0


          if __name__ == "__main__":
              wrap_main(main)
          PY
          uv run /tmp/demo_cli.py > /tmp/bare.out
          test -s /tmp/bare.out || { echo "::error::bare invocation printed nothing to stdout"; exit 1; }
          grep -q "usage:" /tmp/bare.out || { echo "::error::stdout was not help"; exit 1; }
          uv run /tmp/demo_cli.py ping | grep -q '"ok": true'
